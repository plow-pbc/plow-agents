# Example compose for an agent repository -- copy beside your Dockerfile.
services:
  agent:
    build: .
    # Where Plow is and the agent's own token: the KEY=VALUE file
    # `plow-agents mint <line>` writes, loaded as environment. exe.dev sets
    # PLOW_API_BASE alone and injects the token at its proxy; here nothing
    # sits in between, so the token comes along.
    env_file:
      # Optional, because `deploy --local` builds before it mints: on a first
      # run this file does not exist yet when Compose reads the project, and a
      # build does not need it. `up` comes after the mint, and does.
      - path: ./plow-credentials
        required: false
    volumes:
      # The agent's home, kept across `up`/`down` for its sessions and setup.
      # `docker compose down -v` starts this agent fresh.
      - agent-home:/var/lib/hermes
    # The agent checkpoints on SIGTERM; its supervisor allows 30s, and Docker's default 10s cuts it off and orphans the transcript lease.
    stop_grace_period: 35s
    # No ports: the agent connects to Plow outbound.

volumes:
  agent-home:

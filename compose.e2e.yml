# End to end against a Plow stack running on this machine.
#
#   docker compose -f compose.yml -f compose.e2e.yml up -d
#
# All this does is put the agent on that stack's own network, so its API is
# reached by container name: write PLOW_API_BASE=http://api:8000 into
# ./plow-credentials and no host port has to be guessed, and the value does not
# change when the stack's ports do.
services:
  agent:
    networks: [default, plow]

networks:
  # The dev stack's own compose network, joined rather than created.
  plow:
    name: plow_default
    external: true

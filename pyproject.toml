[project]
name = "plow-agents"
version = "0.1.0"
description = "Build, publish and deploy an agent image on your own Plow account."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.12",
]

[project.scripts]
plow-agents = "plow_agents.cli:app"

[project.urls]
Homepage = "https://github.com/plow-pbc/plow-agents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plow_agents"]
# The template is data `init` copies, not importable code, so it needs saying.
artifacts = ["src/plow_agents/template/**"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "websockets>=17.1",
]

[tool.ruff.lint.per-file-ignores]
# The smoke tests are long assertion lines and http.server's own method names.
"tests/*" = ["E501", "N815"]

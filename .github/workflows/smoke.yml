name: CLI smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/smoke-account.py
      - run: python3 tests/smoke-image-build.py
      - run: python3 tests/smoke-agent-images.py
      - run: python3 tests/smoke-cos-wake.py

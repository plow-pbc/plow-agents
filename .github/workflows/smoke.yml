name: CLI smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run python tests/smoke-line-in-use.py
      - run: uv run python tests/smoke-image-deploy.py
      - run: uvx --from . plow-agents --help
